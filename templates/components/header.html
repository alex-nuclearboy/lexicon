{% load i18n static %}

<header class="site-header">
    <div class="site-header__container">
        <a
            class="site-header__brand"
            href="{% url 'core:home' %}"
            aria-label="{% translate 'Vocabio home page' %}"
        >
            <img
                class="site-header__brand-logo"
                src="{% static 'images/vocabio_logo.png' %}"
                alt=""
                width="36"
                height="36"
            >

            <span class="site-header__brand-text">
                Vocabio
            </span>
        </a>

        <nav
            class="site-header__navigation"
            aria-label="{% translate 'Main navigation' %}"
        >
            {% if user.is_authenticated %}
                <form
                    class="site-header__logout-form"
                    method="post"
                    action="{% url 'accounts:logout' %}"
                >
                    {% csrf_token %}

                    <button
                        class="site-header__auth-action"
                        type="submit"
                    >
                        {% translate "Log out" %}
                    </button>
                </form>
            {% else %}
                <a
                    class="site-header__auth-action"
                    href="{% url 'accounts:login' %}"
                >
                    {% translate "Log in" %}
                </a>
            {% endif %}
        </nav>
    </div>
</header>
