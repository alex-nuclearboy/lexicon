<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Server error | Vocabio</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 1.5rem;

            color: #171923;
            background-color: #f7f8fc;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            place-items: center;
        }

        main {
            width: min(100%, 38rem);
            padding: 2.75rem;

            text-align: center;

            background-color: #ffffff;
            border: 1px solid #dfe3eb;
            border-radius: 0.75rem;
        }

        .code {
            margin: 0 0 0.75rem;

            color: #b42318;

            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            font-size: clamp(1.75rem, 4vw, 2.25rem);
            line-height: 1.2;
        }

        p {
            max-width: 32rem;
            margin: 1.25rem auto 0;

            color: #667085;

            line-height: 1.65;
        }

        a {
            display: inline-block;
            margin-top: 1.75rem;

            color: #171923;

            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-thickness: 0.08em;
            text-underline-offset: 0.2em;
        }

        a:focus-visible {
            outline: 0.2rem solid
                rgb(31 129 119 / 25%);
            outline-offset: 0.2rem;
        }

        @media (max-width: 40rem) {
            body {
                align-items: start;
                padding: 2rem 1rem;
            }

            main {
                padding: 2rem 1.25rem;

                background-color: transparent;
                border: 0;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="code">Error 500</p>

        <h1>Something went wrong</h1>

        <p>
            The server could not complete your request.
            Please try again later.
        </p>

        <a href="/">
            Return to home
        </a>
    </main>
</body>
</html>
