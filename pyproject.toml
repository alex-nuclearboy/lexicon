[tool.poetry]
name = "vocabio"
version = "0.1.0"
description = "A personal vocabulary project for learning and organising English words"
authors = ["Alex <alex.nuclearboy@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.0.7"
python-dotenv = "^1.2.2"
psycopg = {extras = ["binary"], version = "^3.3.4"}
dj-database-url = "^3.1.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
