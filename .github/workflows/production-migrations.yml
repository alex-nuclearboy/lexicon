name: Production migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.4.1"

  DJANGO_SECRET_KEY: >-
    github-actions-migration-key-not-used-for-serving-web-requests
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost"

  DATABASE_CONN_MAX_AGE: "0"
  DATABASE_CONNECT_TIMEOUT: "10"

  SECURE_SSL_REDIRECT: "False"

jobs:
  migrate:
    name: Apply production migrations
    if: ${{ inputs.confirmation == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Validate Poetry configuration
        run: poetry check

      - name: Install application dependencies
        run: >
          poetry install
          --only main
          --no-interaction
          --no-root
          --no-ansi

      - name: Show migration plan
        run: poetry run python manage.py migrate --plan

      - name: Apply migrations
        run: poetry run python manage.py migrate --noinput

      - name: Show migration status
        run: poetry run python manage.py showmigrations
